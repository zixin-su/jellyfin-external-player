<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>设置</h1>
        <p class="muted">配置 Jellyfin 服务、外部播放器、播放行为和可选的 STRM 路径映射。</p>
      </header>

      <form id="settingsForm" class="form">
        <label>
          <span>Jellyfin 服务地址</span>
          <input id="serverUrl" type="text" spellcheck="false" placeholder="https://jellyfin.example.com 或 http://192.168.1.10:8096" />
          <small>支持 <code>https://域名</code>、<code>域名</code>、<code>IP:端口</code>，也支持反向代理子路径，例如 <code>https://example.com/jellyfin</code>。</small>
        </label>

        <label class="check">
          <input id="allowInsecureTls" type="checkbox" />
          <span>允许当前 Jellyfin HTTPS 地址使用不受信任证书</span>
          <small>仅在自签证书、证书域名不匹配或内网反代证书未被系统信任时使用；只对上方 Jellyfin 服务地址生效。</small>
        </label>

        <label>
          <span>外部播放器</span>
          <div class="row">
            <input id="externalPlayerPath" type="text" placeholder="C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe" />
            <button id="browsePlayer" type="button">浏览</button>
          </div>
        </label>

        <label>
          <span>播放器参数</span>
          <input id="playerArgs" type="text" placeholder="{url}" />
          <small>可用占位符：<code>{url}</code> <code>{path}</code> <code>{title}</code> <code>{itemId}</code>。示例：<code>--fullscreen {url}</code></small>
        </label>

        <label class="check">
          <input id="interceptPlayback" type="checkbox" />
          <span>拦截 Jellyfin 播放并打开外部播放器</span>
        </label>

        <fieldset class="option-group">
          <legend>播放地址来源</legend>
          <label class="radio">
            <input type="radio" name="playbackMode" value="jellyfin-stream" checked />
            <span>Jellyfin 流模式</span>
            <span class="help" tabindex="0" aria-label="由 Jellyfin 生成 HTTP 播放流，兼容性最好，也是默认选项。">?</span>
          </label>
          <label class="radio">
            <input type="radio" name="playbackMode" value="media-path" />
            <span>直接路径模式</span>
            <span class="help" tabindex="0" aria-label="把 Jellyfin 媒体源路径直接传给外部播放器；如果媒体是 STRM，则读取 STRM 第一行里的路径。要求客户端本机能访问该路径。">?</span>
          </label>
          <label class="radio">
            <input type="radio" name="playbackMode" value="helper" />
            <span>辅助服务模式</span>
            <span class="help" tabindex="0" aria-label="把 Jellyfin 媒体源路径交给 NAS/Jellyfin 旁边的辅助服务解析，由辅助服务提供支持拖动进度的 HTTP Range 流。">?</span>
          </label>
        </fieldset>

        <label class="check">
          <input id="invertWheelScroll" type="checkbox" />
          <span>反转 Jellyfin 页面内的鼠标滚轮方向</span>
        </label>

        <section id="helperSettings" class="conditional" hidden>
          <label>
            <span>NAS 辅助服务地址</span>
            <input id="strmHelperUrl" type="text" spellcheck="false" placeholder="http://192.168.1.10:8097" />
            <small>辅助服务临时不可用时会降级走 Jellyfin 流；令牌错误或路径权限错误会提示修正配置。</small>
          </label>

          <label>
            <span>NAS 辅助服务令牌（可选）</span>
            <input id="strmHelperToken" type="password" autocomplete="off" placeholder="JEP_HELPER_TOKEN" />
            <small>如果 NAS 辅助服务配置了访问令牌，这里填写同一个值。</small>
          </label>
        </section>

        <section id="pathMappingSettings" class="conditional" hidden>
          <label>
            <span>STRM 路径映射</span>
            <textarea id="strmPathMappings" rows="7" placeholder="/mnt/media => Z:\media&#10;/volume1/video => \\NAS\video"></textarea>
            <small>每行一个映射。媒体文件路径模式下右侧是本机 Windows 可访问路径；辅助服务模式下右侧是辅助服务所在机器可访问路径。</small>
          </label>
        </section>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="actions">
          <button type="submit" class="primary">保存</button>
          <button id="openDataFolder" type="button">打开数据目录</button>
        </div>
      </form>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
