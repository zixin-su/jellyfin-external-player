<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings">
      <header>
        <h1>Settings</h1>
        <p class="muted">Configure the Jellyfin server, external player, playback behavior, and optional STRM path mappings.</p>
      </header>

      <form id="settingsForm" class="form">
        <label>
          <span>Jellyfin Server URL</span>
          <input id="serverUrl" type="url" placeholder="http://192.168.1.10:8096" />
        </label>

        <label>
          <span>External Player</span>
          <div class="row">
            <input id="externalPlayerPath" type="text" placeholder="C:\Program Files\DAUM\PotPlayer\PotPlayerMini64.exe" />
            <button id="browsePlayer" type="button">Browse</button>
          </div>
        </label>

        <label>
          <span>Player Arguments</span>
          <input id="playerArgs" type="text" placeholder="{url}" />
          <small>Available placeholders: <code>{url}</code> <code>{path}</code> <code>{title}</code> <code>{itemId}</code>. Example: <code>--fullscreen {url}</code></small>
        </label>

        <label class="check">
          <input id="interceptPlayback" type="checkbox" />
          <span>Intercept Jellyfin playback and open external player</span>
        </label>

        <label class="check">
          <input id="preferJellyfinStream" type="checkbox" />
          <span>Send Jellyfin HTTP stream URL to external player when possible</span>
        </label>

        <label class="check">
          <input id="preferStrmTarget" type="checkbox" />
          <span>For STRM items, read the STRM target before launching player</span>
        </label>

        <label class="check">
          <input id="preferLocalFiles" type="checkbox" />
          <span>Use local file paths when Jellyfin paths are readable on this PC</span>
        </label>

        <label class="check">
          <input id="invertWheelScroll" type="checkbox" />
          <span>Reverse mouse wheel direction inside Jellyfin pages</span>
        </label>

        <label>
          <span>STRM Path Mappings</span>
          <textarea id="strmPathMappings" rows="7" placeholder="/mnt/media => Z:\media&#10;/volume1/video => \\NAS\video"></textarea>
          <small>One mapping per line. The left side is the path prefix seen by Jellyfin; the right side is the Windows path prefix readable on this PC.</small>
        </label>

        <p id="status" class="status" aria-live="polite"></p>

        <div class="actions">
          <button type="submit" class="primary">Save</button>
          <button id="openDataFolder" type="button">Open Data Folder</button>
        </div>
      </form>
    </main>
    <script src="./settings.js"></script>
  </body>
</html>
